[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finrep"
version = "0.1.0"
description = "A股上市公司财报分析与同行业对比系统"
requires-python = ">=3.10"
dependencies = [
    "akshare>=1.18",
    "tushare>=1.4",
    "duckdb>=1.1",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "tenacity>=9.0",
    "typer>=0.15",
    "jinja2>=3.1",
    "xlsxwriter>=3.2",
    "openai>=1.50",          # AI 分析: GLM/DeepSeek (OpenAI 兼容)
    "pdfplumber>=0.11",      # 年报 PDF 文本抽取
    "requests>=2.31",        # 年报 PDF 下载
]

[project.optional-dependencies]
web = ["streamlit>=1.40", "pyecharts>=2.0"]  # 看板与可视化
pdf = ["weasyprint>=62"]
dev = ["pytest>=8.0"]

[project.scripts]
finrep = "finrep.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]
